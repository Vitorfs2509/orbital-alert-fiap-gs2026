spring.datasource.url=jdbc:h2:mem:orbital_alert;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

springdoc.swagger-ui.path=/swagger-ui.html
server.port=8080

# Fase 5 - Data Lake e IA generativa
orbital.datalake.enabled=${DATA_LAKE_ENABLED:true}
orbital.datalake.base-path=${DATA_LAKE_PATH:../data-lake}
# mock (padrao, funciona offline e sem API key) | openai (opcional)
orbital.ai.provider=${AI_PROVIDER:mock}
orbital.ai.model=${AI_MODEL:gpt-4o-mini}
orbital.ai.base-url=${AI_BASE_URL:https://api.openai.com/v1}
# Nunca versione a chave: ela vem apenas da variavel de ambiente OPENAI_API_KEY.
orbital.ai.api-key=${OPENAI_API_KEY:}
