spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orbital_alert}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
